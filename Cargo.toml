[package]
name = "macclip"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
dispatch2 = "0.3.1"
env_logger = "0.11.11"
global-hotkey = "0.9.0"
libc = "0.2.191"
log = "0.4.34"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-service-management = "0.3.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[lib]
name = "macclip"
path = "src/lib.rs"

[[bin]]
name = "macclip"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
opt-level = "z"

[dev-dependencies]
tempfile = "3"
